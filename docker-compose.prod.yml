# Overlay konfigurasi server Ubuntu (IP Publik + Port via HTTP)
services:
  app:
    restart: always

  webserver:
    restart: always
    ports: !override
      - "${APP_PORT:-80}:80"

  db:
    restart: always
    ports: !override
      - "127.0.0.1:${DB_EXTERNAL_PORT:-3306}:3306"

  phpmyadmin:
    restart: always
    ports: !override
      - "127.0.0.1:${PMA_PORT:-8081}:80"

  redis:
    restart: always
    ports: !override
      - "127.0.0.1:${REDIS_EXTERNAL_PORT:-6379}:6379"
