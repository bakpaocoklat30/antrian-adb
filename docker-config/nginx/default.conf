# =========================================================
# 1. BLOK HTTP (PORT 80) - Penendang Paksa ke HTTPS
# =========================================================
server {
    listen 80;
    server_name antrian.smkn1adw.sch.id _;
    
    # Otomatis melempar semua HTTP ke HTTPS
    return 301 https://$host$request_uri;
}

# =========================================================
# 2. BLOK HTTPS (PORT 443) - Pintu Utama Gembok Hijau
# =========================================================
server {
    listen 443 ssl;
    server_name antrian.smkn1adw.sch.id _;

    # Konfigurasi Log
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # Folder public Laravel
    root /var/www/public;
    index index.php index.html;

    # 🔥 MEMPERTAHANKAN BATAS UPLOAD DATABASE SQL 700M 🔥
    client_max_body_size 700M;

    # 🔥 JALUR SERTIFIKAT LET'S ENCRYPT RESMI 🔥
    ssl_certificate /etc/letsencrypt/live/antrian.smkn1adw.sch.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/antrian.smkn1adw.sch.id/privkey.pem;

    # Standar keamanan SSL Tertinggi
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Aturan URL Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    # Aturan PHP-FPM (Menyambung ke container 'app')
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\..+)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # 🔥 ANTI 504 GATEWAY TIMEOUT: Naikkan batas tunggu Nginx ke PHP 🔥
        fastcgi_read_timeout 300;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
    }
}