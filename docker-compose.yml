services:
  # ─── LARAVEL APPLICATION (PHP-FPM) ──────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: disapa_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker-config/php/custom-php.ini:/usr/local/etc/php/conf.d/custom-php.ini:ro
      - ./docker-config/php/zz-docker.conf:/usr/local/etc/php-fpm.d/zz-docker.conf:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - disapa_network

  # ─── NGINX (WEB SERVER LOKAL - HTTP) ─────────────────
  webserver:
    image: nginx:alpine
    container_name: disapa_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www
      - ./docker-config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - disapa_network

  # ─── MYSQL 8.0 DATABASE ────────────────────────────
  db:
    image: mysql:8.0
    container_name: disapa_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-disapa_db}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - disapa_mysql_data:/var/lib/mysql
    ports:
      - "${DB_EXTERNAL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - disapa_network

  # ─── PHPMYADMIN ────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: disapa_pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    ports:
      - "${PMA_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - disapa_network

  # ─── REDIS ─────────────────────────────────────────
  redis:
    image: redis:alpine
    container_name: disapa_redis
    restart: unless-stopped
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:6379"
    volumes:
      - disapa_redis_data:/data
    networks:
      - disapa_network

networks:
  disapa_network:
    driver: bridge

volumes:
  disapa_mysql_data:
  disapa_redis_data:
