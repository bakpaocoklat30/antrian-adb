version: '3.8'

services:
  # ─── LARAVEL APPLICATION (PHP-FPM) ──────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: disapa_app
    restart: always
    working_dir: /var/www
    volumes:
      - .:/var/www  # 🔥 Ini yang membuat folder di Windows & Docker sinkron!
      # 🔥 CONFIG PHP CUSTOM:
      - ./docker-config/php/custom-php.ini:/usr/local/etc/php/conf.d/custom-php.ini
      # 🔥 INJEKSI TUNING PHP-FPM BARU (ANTI 504 TIME OUT):
      - ./docker-config/php/zz-docker.conf:/usr/local/etc/php-fpm.d/zz-docker.conf
    depends_on:
      - db
      - redis
    networks:
      - disapa_network
    #ports:
      #- "8000:8000"
      #- "8080:8080" # Port Reverb

  # ─── NGINX (WEB SERVER) ──────────────────────────────
  webserver:
    image: nginx:alpine
    container_name: disapa_nginx
    restart: always
    ports:
      #- "8000:80"
      - "80:80"      # 🔥 WAJIB 80
      - "443:443"    # 🔥 WAJIB 443
    volumes:
      - .:/var/www
      - ./docker-config/nginx:/etc/nginx/conf.d # Mapping config nginx
      - ./docker-config/nginx/default.conf:/etc/nginx/conf.d/custom-upload-limit.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - disapa_network

  # ─── MYSQL 8.0 DATABASE ────────────────────────────
  db:
    image: mysql:8.0
    container_name: disapa_db
    restart: always
    environment:
      MYSQL_DATABASE: disapa_db
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - disapa_mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - disapa_network

  # ─── PHPMYADMIN ────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: disapa_pma
    restart: always
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - disapa_network

  # ─── REDIS ─────────────────────────────────────────
  redis:
    image: redis:alpine
    container_name: disapa_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - disapa_redis_data:/data
    networks:
      - disapa_network

networks:
  disapa_network:
    driver: bridge

volumes:
  disapa_mysql_data:
  disapa_redis_data: